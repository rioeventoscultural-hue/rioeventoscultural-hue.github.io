<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maia Baba Pet</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Nunito',sans-serif}
body{background:#2aa99e;padding:12px}
.container{max-width:420px;margin:0 auto}
.header{background:#fff;border-radius:24px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between}
.title{color:#fff;font-size:30px;font-weight:900;margin:22px 4px 12px}
.card{background:#fff;border-radius:22px;padding:14px;display:flex;align-items:center;gap:14px;margin-bottom:14px;border:3px solid transparent}
.card.active{border-color:#fff;transform:scale(1.02)}
.avatar{width:82px;height:82px;border-radius:50%;object-fit:cover}
.pet-name{font-size:26px;font-weight:900;color:#0d3c44}
.btn{background:#fff;border-radius:18px;padding:12px 6px;text-align:center;border:none;width:100%}
.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
</style>
</head>
<body>
<div class="container">
<div class="header"><b style="font-size:28px;color:#4a1a8a">🐾 Maia BABÁ PET</b></div>
<div class="title">Meus Pets</div>
<div class="card active" id="card-thor" onclick="selectPet('thor')">
<img class="avatar" src="https://images.unsplash.com/photo-1552053831-71594a27632d?w=200">
<div><div class="pet-name">Thor</div>Golden • 4 anos <span style="background:#d6f5e3;color:#1a8a5a;padding:3px 8px;border-radius:12px;font-size:12px">Ativo ●</span></div>
</div>
<div class="card" id="card-luna" onclick="selectPet('luna')">
<img class="avatar" src="https://images.unsplash.com/photo-1561037404-61cd46aa615b?w=200">
<div><div class="pet-name">Luna</div>SRD • 2 anos <span style="background:#d6f5e3;color:#1a8a5a;padding:3px 8px;border-radius:12px;font-size:12px">Ativo ●</span></div>
</div>
<div class="title">Ações Rápidas</div>
<div class="actions">
<button class="btn" onclick="aoVivo()"><div>📺</div><b>Ao Vivo<br>TV Câmera</b></button>
<button class="btn" onclick="copiarLink()"><div>💬</div><b>Mensagem</b></button>
<button class="btn" onclick="falarMaia()"><div>🎧</div><b>Falar com Maia</b></button>
</div>
</div>
<script>
let petAtivo='thor';
function selectPet(p){petAtivo=p;document.getElementById('card-thor').classList.remove('active');document.getElementById('card-luna').classList.remove('active');document.getElementById('card-'+p).classList.add('active')}
function getLink(){return location.href.split('?')[0]+'?tutor=maia-'+Math.random().toString(36).substring(2,6)+'&pet='+petAtivo}
function aoVivo(){window.open(getLink(),'_blank')}
function copiarLink(){navigator.clipboard.writeText(getLink());alert('Link privado copiado!')}
function falarMaia(){window.open('https://wa.me/5517991496656?text=Ola Maia sobre '+petAtivo,'_blank')}
</script>
</body>
</html>
