<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maia Baba Pet</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:sans-serif;background:#f5f0ff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.app{width:100%;max-width:390px;background:#fff;border-radius:32px;overflow:hidden;box-shadow:0 20px 60px rgba(124,58,237,.3)}
.top{background:linear-gradient(135deg,#7c3aed,#a855f7);padding:28px;text-align:center;color:#fff}

.logo img{width:100%;height:100%;object-fit:contain}
.card{background:#faf5ff;border:2px solid #ede9fe;border-radius:18px;padding:14px;margin:12px 20px;display:flex;gap:10px}
.btn{width:100%;background:#7c3aed;color:#fff;border:none;padding:16px;border-radius:16px;font-weight:800;margin:20px 0}
</style>
</head>
<body>
<div class="app">
<div class="top">
<div class="logo"><img src="IMG-20261002-WA0018.jpg"></div>

</div>
<div class="card">🐶 Thor - Ao Vivo - Câmera 01</div>
<div class="card">🐱 Luna - Descansando</div>

</div>
</div>

</html>
