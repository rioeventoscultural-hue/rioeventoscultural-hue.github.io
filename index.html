<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maia Baba Pet</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#2FB1A6;padding:12px}
.box{max-width:420px;margin:0 auto}
.top{background:#fff;border-radius:24px;padding:14px;display:flex;align-items:center;gap:10px}
.top b{color:#5E2B97;font-size:26px}
h2{color:#fff;font-size:32px;margin:20px 6px 12px}
.card{background:#fff;border-radius:20px;padding:14px;display:flex;gap:12px;margin-bottom:12px}
.card img{width:75px;height:75px;border-radius:50%}
.tag{background:#d4f5e2;color:#0a8a4b;padding:2px 8px;border-radius:12px;font-size:12px}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.btn{background:#fff;border:0;border-radius:18px;padding:14px 5px;font-weight:900;color:#0c3d44}
</style>
</head>
<body>
<div class="box">
<div class="top">🐾 <b>Maia BABÁ PET</b></div>
<h2>Meus Pets</h2>
<div class="card" onclick="pet='thor'" id="t"><img src="https://images.unsplash.com/photo-1552053831-71594a27632d?w=200"><div><b>Thor</b><br>Golden • 4 anos <span class="tag">Ativo ●</span></div></div>
<div class="card" onclick="pet='luna'" id="l"><img src="https://images.unsplash.com/photo-1583512603807-3cc6b8da5029?w=200"><div><b>Luna</b><br>SRD • 2 anos <span class="tag">Ativo ●</span></div></div>
<h2>Ações Rápidas</h2>
<div class="grid">
<button class="btn" onclick="aoVivo()">📺<br>Ao Vivo TV Câmera</button>
<button class="btn" onclick="copiar()">💬<br>Mensagem</button>
<button class="btn" onclick="zap()">🎧<br>Falar com Maia</button>
</div>
</div>
<script>
let pet='thor';
function link(){return location.href.split('?')[0]+'?tutor=maia-'+Math.random().toString(36).slice(2,5)+'&pet='+pet}
function aoVivo(){window.open(link(),'_blank')}
function copiar(){navigator.clipboard.writeText(link());alert('Link copiado!')}
function zap(){window.open('https://wa.me/5517991496656?text=Olá Maia sobre '+pet,'_blank')}
</script>
</body>
</html>
